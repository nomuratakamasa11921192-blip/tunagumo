<style>
  :root { --bg:#F6F4EF; --page-bg:#FFFFFF; --ink:#22283A; --ink-soft:#4B5165; --ink-faint:#7A8093; --accent:#B8792F; --accent-soft:#EFE3D1; --line:#D9D3C7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161C; --page-bg:#1B1E27; --ink:#ECE7DC; --ink-soft:#B7BAC4; --ink-faint:#7E8494; --accent:#D79A52; --accent-soft:rgba(183,121,47,0.16); --line:#333A48; } }
  :root[data-theme="dark"] { --bg:#14161C; --page-bg:#1B1E27; --ink:#ECE7DC; --ink-soft:#B7BAC4; --ink-faint:#7E8494; --accent:#D79A52; --accent-soft:rgba(183,121,47,0.16); --line:#333A48; }
  :root[data-theme="light"] { --bg:#F6F4EF; --page-bg:#FFFFFF; --ink:#22283A; --ink-soft:#4B5165; --ink-faint:#7A8093; --accent:#B8792F; --accent-soft:#EFE3D1; --line:#D9D3C7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"游ゴシック体","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.8; }
  a { color: inherit; }
  h1, h2 { font-family:"游明朝","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif; text-wrap: balance; margin:0; }
  header { position: sticky; top:0; z-index:10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:640px; margin:0 auto; }
  .logo { font-family:"游明朝",serif; font-size:20px; font-weight:700; letter-spacing:0.08em; text-decoration:none; color:var(--ink); }
  .logo span { color: var(--accent); }
  .nav-back { font-size:13.5px; color:var(--ink-soft); text-decoration:none; }
  .nav-back:hover { color: var(--accent); }
  .hero { padding: 56px 24px 8px; text-align:center; }
  .hero h1 { font-size: clamp(22px, 5vw, 30px); margin-bottom:10px; }
  .hero p { font-size: 14px; color: var(--ink-faint); margin: 0 0 8px; }
  section { padding: 32px 24px 56px; }
  .section-inner { max-width: 560px; margin: 0 auto; }
  .spot-list { list-style: none; margin:0; padding:0; background: var(--page-bg); border:1px solid var(--line); border-radius:10px; overflow: hidden; }
  .spot-list li { display:flex; justify-content:space-between; align-items:baseline; gap: 12px; padding: 18px 22px; border-top: 1px solid var(--line); font-size:14.5px; }
  .spot-list li:first-child { border-top: none; }
  .spot-list .price { color: var(--accent); font-weight:700; white-space: nowrap; font-size: 13.5px; }
  .note { text-align:center; font-size:12.5px; color:var(--ink-faint); margin-top:18px; }
  .cta-center { text-align:center; margin-top: 32px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:4px; font-size:13.5px; font-weight:700; text-decoration:none; letter-spacing:0.02em; border: 1px solid var(--line); color: var(--ink); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  footer { padding:32px 24px; text-align:center; font-size:12.5px; color:var(--ink-faint); }
</style>

</html>
