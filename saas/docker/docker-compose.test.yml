# 開発用cloneでテストを回すための上書き設定。
#
# 使い方(daily_qa.sh が自動で付ける):
#   docker compose -p tunagumo-dev -f docker-compose.yml -f docker-compose.test.yml <コマンド>
#
# 目的(SYSTEM_PROMPT.md §6.1 参照):
#   1. env_file を本番の ../.env から開発用の ../.env.test に差し替える
#   2. ポート8000を本番と衝突させない(テストではAPIを外部公開する必要が無いので閉じる)
#   3. scheduler は常駐不要なのでプロファイルで除外する
#
# プロジェクト名 -p tunagumo-dev と併せて使うことで、本番(/opt/tsunagumo)の
# コンテナ・イメージ・ボリュームと完全に分離される。

services:
  api:
    # env_file は既定だと「追加」されてしまい ../.env を探しに行ってしまう。
    # !reset で基底ファイルの指定を打ち消してから、開発用だけを指定する。
    env_file: !reset null
    environment:
      # env_file を打ち消したので、テストに必要な変数はここで明示的に渡す。
      # 値は --env-file ../.env.test から展開される。
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-test-dummy-key}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-test-model}"
      ANTHROPIC_MODEL_LIGHT: "${ANTHROPIC_MODEL_LIGHT:-test-model-light}"
      # 既定値を入れない。空のまま渡すことで「キー未設定なら402」のテストが通る
      # (.env.test.example のコメント参照)。
      OPENAI_API_KEY: "${OPENAI_API_KEY-}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-test-admin-key}"
      TENANT_SECRET_KEY: "${TENANT_SECRET_KEY:?TENANT_SECRET_KEYが未設定です。saas/.env.testを確認してください}"
      SAAS_PUBLIC_URL: "${SAAS_PUBLIC_URL:-http://localhost:8000}"
    # 本番が8000を使っているため、テスト用は公開しない。
    # pytestはコンテナ内で実行するので外部ポートは不要。
    ports: !reset null
    restart: "no"

  scheduler:
    env_file: !reset null
    # テスト中に定期実行が走る必要は無いので、明示的に指定した時だけ起動する。
    profiles: ["never"]
    restart: "no"

  db:
    restart: "no"
